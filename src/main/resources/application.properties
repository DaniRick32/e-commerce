# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=change-this-development-secret-key-to-a-long-random-value-123456789
app.jwt.expiration-ms=86400000

# Redis-backed product search cache (Redis runs in Docker, see compose.yaml).
# Compose sets REDIS_HOST to the "redis" service name when the app runs in Docker.
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

app.cache.product-search.enabled=${PRODUCT_SEARCH_CACHE_ENABLED:true}
app.cache.product-search.ttl=${PRODUCT_SEARCH_CACHE_TTL:60s}