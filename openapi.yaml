openapi: 3.0.3

info:
  title: E-commerce API
  version: 1.0.0
  description: |
    REST API for the E-commerce demo application.

    **Authentication:** call `/api/auth/register` or `/api/auth/login`, then send the
    returned token as `Authorization: Bearer <token>` on protected endpoints.
  contact:
    name: E-commerce
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
    description: Registration and login
  - name: Users
    description: Authenticated user profile
  - name: Products
    description: Product catalogue management
  - name: Brands
    description: Brand and manufacturer management

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a user account and returns a JWT. Email is stored trimmed and lowercased.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: secret123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed (missing email/password, invalid email, short password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A user with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Validates credentials and returns a JWT.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/me:
    get:
      tags: [Users]
      summary: Get the current user
      description: Returns the profile of the user identified by the bearer token.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products:
    get:
      tags: [Products]
      summary: List all products
      operationId: getProducts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
            example:
              name: Wireless Mouse
              description: Ergonomic wireless mouse with USB receiver
              price: 24.99
              stock: 50
              categoryId: 1
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A product with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/search:
    get:
      tags: [Products]
      summary: Search products
      description: |
        Returns the products that match all supplied filters. Every parameter is
        optional, so calling the endpoint without parameters lists all products.

        - `q` is matched case-insensitively against the product name and description.
        - `categoryId`, `brandId`, `minPrice` and `maxPrice` narrow the result set.
        - `minPrice` must be less than or equal to `maxPrice` when both are given.

        Results are ordered by product name, then by id.
      operationId: searchProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductSearchQuery'
        - $ref: '#/components/parameters/ProductCategoryFilter'
        - $ref: '#/components/parameters/ProductBrandFilter'
        - $ref: '#/components/parameters/ProductMinPrice'
        - $ref: '#/components/parameters/ProductMaxPrice'
      responses:
        '200':
          description: Products matching the search filters (empty array when nothing matches)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Invalid price filter (negative value or minPrice greater than maxPrice)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-06T16:30:00Z'
                status: 400
                error: Bad Request
                path: /api/products/search
                message: minPrice must be less than or equal to maxPrice
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'

    patch:
      tags: [Products]
      summary: Partially update a product
      description: |
        Updates only the fields included in the request body.
        Omitted or `null` fields are left unchanged.
      operationId: updateProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
            example:
              price: 19.99
              stock: 25
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation failed (for example a blank name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product or category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A product with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Products]
      summary: Delete a product
      operationId: deleteProduct
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Product deleted
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/brands:
    get:
      tags: [Brands]
      summary: List all brands
      operationId: getBrands
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Brand list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrandResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Brands]
      summary: Create a brand
      operationId: createBrand
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
            example:
              name: Acme
              countryOfMade: Japan
              rating: 4.5
              description: Consumer electronics manufacturer
      responses:
        '201':
          description: Brand created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A brand with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/brands/{id}:
    parameters:
      - $ref: '#/components/parameters/BrandId'

    get:
      tags: [Brands]
      summary: Get a brand
      operationId: getBrand
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Brand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Brands]
      summary: Partially update a brand
      description: |
        Updates only the fields included in the request body.
        Omitted or `null` fields are left unchanged.
      operationId: updateBrand
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandUpdateRequest'
            example:
              rating: 4.8
      responses:
        '200':
          description: Brand updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '400':
          description: Validation failed (for example a blank name or rating above 5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A brand with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Brands]
      summary: Delete a brand
      description: Deletion is refused while products still reference the brand.
      operationId: deleteBrand
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Brand deleted
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Brand is still assigned to one or more products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/brands/{id}/products:
    parameters:
      - $ref: '#/components/parameters/BrandId'

    get:
      tags: [Brands]
      summary: List a brand's products
      description: Returns every product assigned to the brand, ordered by product name then id.
      operationId: getBrandProducts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Products belonging to the brand
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by `/api/auth/register` or `/api/auth/login`.

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product identifier
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

    ProductSearchQuery:
      name: q
      in: query
      required: false
      description: Case-insensitive text matched against product name and description.
      schema:
        type: string
      example: mouse

    ProductCategoryFilter:
      name: categoryId
      in: query
      required: false
      description: Only return products that belong to this category.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

    ProductBrandFilter:
      name: brandId
      in: query
      required: false
      description: Only return products made by this brand.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

    BrandId:
      name: id
      in: path
      required: true
      description: Brand identifier
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

    ProductMinPrice:
      name: minPrice
      in: query
      required: false
      description: Only return products priced at or above this amount.
      schema:
        type: number
        format: double
        minimum: 0
        maximum: 99999999.99
      example: 10.00

    ProductMaxPrice:
      name: maxPrice
      in: query
      required: false
      description: Only return products priced at or below this amount.
      schema:
        type: number
        format: double
        minimum: 0
        maximum: 99999999.99
      example: 100.00

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: secret123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: secret123

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c2VyQGV4YW1wbGUuY29tIn0.signature
        tokenType:
          type: string
          example: Bearer
        userId:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        role:
          $ref: '#/components/schemas/Role'

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      enum: [USER, ADMIN]
      example: USER

    BrandRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: Acme
        countryOfMade:
          type: string
          maxLength: 100
          nullable: true
          example: Japan
        rating:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5
          description: Brand rating from 0 to 5 with at most 2 decimal places
          example: 4.5
        description:
          type: string
          nullable: true
          example: Consumer electronics manufacturer

    BrandUpdateRequest:
      type: object
      description: All fields are optional; only provided (non-null) fields are updated.
      properties:
        name:
          type: string
          maxLength: 100
          example: Acme
        countryOfMade:
          type: string
          maxLength: 100
          nullable: true
          example: Japan
        rating:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5
          description: Brand rating from 0 to 5 with at most 2 decimal places
          example: 4.8
        description:
          type: string
          nullable: true
          example: Updated description

    BrandResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Acme
        countryOfMade:
          type: string
          nullable: true
          example: Japan
        rating:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5
          example: 4.5
        description:
          type: string
          nullable: true
          example: Consumer electronics manufacturer

    ProductRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          maxLength: 150
          example: Wireless Mouse
        description:
          type: string
          nullable: true
          example: Ergonomic wireless mouse with USB receiver
        price:
          type: number
          format: double
          minimum: 0
          maximum: 99999999.99
          description: Amount with at most 2 decimal places
          example: 24.99
        stock:
          type: integer
          format: int32
          minimum: 0
          default: 0
          example: 50
        categoryId:
          type: integer
          format: int64
          nullable: true
          description: Existing category id, or null for no category
          example: 1
        brandId:
          type: integer
          format: int64
          nullable: true
          description: Existing brand id, or null for no brand
          example: 1

    ProductUpdateRequest:
      type: object
      description: All fields are optional; only provided (non-null) fields are updated.
      properties:
        name:
          type: string
          maxLength: 150
          example: Wireless Mouse
        description:
          type: string
          nullable: true
          example: Updated description
        price:
          type: number
          format: double
          minimum: 0
          maximum: 99999999.99
          description: Amount with at most 2 decimal places
          example: 19.99
        stock:
          type: integer
          format: int32
          minimum: 0
          example: 25
        categoryId:
          type: integer
          format: int64
          nullable: true
          description: Existing category id. Null or omitted leaves the category unchanged.
          example: 1
        brandId:
          type: integer
          format: int64
          nullable: true
          description: Existing brand id. Null or omitted leaves the brand unchanged.
          example: 1

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Wireless Mouse
        description:
          type: string
          nullable: true
          example: Ergonomic wireless mouse with USB receiver
        price:
          type: number
          format: double
          example: 24.99
        stock:
          type: integer
          format: int32
          example: 50
        categoryId:
          type: integer
          format: int64
          nullable: true
          example: 1
        categoryName:
          type: string
          nullable: true
          example: Electronics
        brandId:
          type: integer
          format: int64
          nullable: true
          example: 1
        brandName:
          type: string
          nullable: true
          example: Acme
        brandCountryOfMade:
          type: string
          nullable: true
          example: Japan
        brandRating:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 5
          example: 4.5
        createdAt:
          type: string
          format: date-time
          example: '2026-11-06T16:30:00Z'

    ErrorResponse:
      type: object
      description: Error payload returned by Spring Boot.
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-11-06T16:30:00Z'
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        path:
          type: string
          example: /api/products/999
        message:
          type: string
          description: Present when message inclusion is enabled on the server.
          example: Product not found
